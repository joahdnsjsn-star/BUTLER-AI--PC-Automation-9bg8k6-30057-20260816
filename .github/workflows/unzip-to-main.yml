name: Unzip Update to Main

on:
  push:
    branches:
      - update
    paths:
      - '**/*.zip'
  workflow_dispatch:
    inputs:
      zip_path:
        description: Optional explicit zip path in repository
        required: false
        default: ''
      zip_pattern:
        description: Glob to find zip files when zip_path is not provided
        required: false
        default: '**/*.zip'
      dry_run:
        description: Validate and stage changes without commit/push
        required: false
        type: boolean
        default: false
      fail_if_no_zip:
        description: Fail workflow if no zip is found
        required: false
        type: boolean
        default: true
      extraction_timeout_seconds:
        description: Timeout for unzip attempt in seconds
        required: false
        default: '180'
      extract_retries:
        description: Number of unzip retries after initial attempt
        required: false
        default: '2'

concurrency:
  group: zip-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy zip contents to target branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: main
      ZIP_PATTERN: ${{ github.event.inputs.zip_pattern || '**/*.zip' }}
      REQUESTED_ZIP: ${{ github.event.inputs.zip_path || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      FAIL_IF_NO_ZIP: ${{ github.event.inputs.fail_if_no_zip || 'true' }}
      EXTRACT_TIMEOUT_SECONDS: ${{ github.event.inputs.extraction_timeout_seconds || '180' }}
      EXTRACT_RETRIES: ${{ github.event.inputs.extract_retries || '2' }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: update
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Resolve zip to deploy ─────────────────────────────────────────────
      - name: Resolve zip to deploy
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""
          if [ -n "$REQUESTED_ZIP" ]; then
            if [ ! -f "$REQUESTED_ZIP" ]; then
              echo "Requested zip does not exist: $REQUESTED_ZIP"
              exit 1
            fi
            ZIP_PATH="$REQUESTED_ZIP"
          fi

