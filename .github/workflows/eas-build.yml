name: EAS Build — Preview

# Automatically triggers an EAS preview (APK) build whenever code is
# pushed to main.  Requires the EXPO_TOKEN secret to be set in
# Settings → Secrets → Actions.

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'utils/**'
      - 'constants/**'
      - 'assets/**'
      - 'package.json'
      - 'app.json'
      - 'eas.json'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - preview-safe
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build and wait for result
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "🚀 Starting EAS build with profile: $PROFILE"

          # Run build and wait for it to finish (removes --no-wait).
          # The CLI exits non-zero on build failure, so the step fails if the
          # APK/AAB build itself fails — making the result visible in CI.
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive

          echo ""
          echo "✅ EAS build finished successfully."
          echo "   Download your artifact from:"
          echo "   https://expo.dev/accounts/andrejsladkovic/projects/butler-ai/builds"
